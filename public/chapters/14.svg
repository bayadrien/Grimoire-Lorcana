<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Chapitre 14 — Hyperia City</title>
  <desc id="description">Visuel temporaire représentant une cité lumineuse et futuriste.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
